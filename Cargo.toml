[package]
name = "dawiki"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
pulldown-cmark = "0.12"
ammonia = "4"
dotenvy = "0.15"
tera = "1.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
