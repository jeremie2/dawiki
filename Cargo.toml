[package]
name = "dawiki"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
pulldown-cmark = "0.12"
dotenvy = "0.15"
tera = "1.20" 
serde = { version = "1.0.229", features = ["derive"] }
