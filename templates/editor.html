<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Crea Nuova Pagina - DaWiki</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea { width: 100%; margin-bottom: 15px; padding: 8px; font-size: 16px; box-sizing: border-box; }
        textarea { height: 250px; font-family: monospace; }
        button { padding: 10px 20px; background: #007acc; color: white; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #005999; }
    </style>
</head>
<body>
    <h1>Nuova Pagina Wiki</h1>
    <form action="/pagine/salva" method="POST">
        <label for="slug">Percorso Virtuale (Slug):</label>
        <input type="text" id="slug" name="slug" placeholder="es: /hardware/video/amd" required>
        
        <label for="titolo">Titolo della Pagina:</label>
        <input type="text" id="titolo" name="titolo" placeholder="es: Schede Video AMD" required>
        
        <label for="markdown">Contenuto in Markdown:</label>
        <textarea id="markdown" name="markdown" placeholder="Scrivi qui usando il # Markdown..." required></textarea>
        
        <button type="submit">Salva Pagina</button>
    </form>
</body>
</html>
